<script>
(function () {
  function send(data) {
    try { parent.postMessage(Object.assign({ source: 'webever' }, data), '*'); } catch (e) {}
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a');
    if (!a) return;
    var href = a.getAttribute('href') || '';
    if (href.charAt(0) === '#') {
      e.preventDefault();
      send({ type: 'navigate', hash: href, mode: a.getAttribute('data-set-mode') || null });
    }
  });
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.source !== 'webever-parent') return;
    if (d.type === 'theme') document.documentElement.setAttribute('data-theme', d.theme);
    if (d.type === 'scroll-to' && d.id) {
      var el = document.getElementById(d.id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    if (d.type === 'set-mode') {
      document.querySelectorAll('[data-mode]').forEach(function (n) {
        n.setAttribute('aria-pressed', n.getAttribute('data-mode') === d.mode ? 'true' : 'false');
      });
    }
  });
  window.addEventListener('scroll', function () {
    send({ type: 'scroll', y: window.scrollY || 0 });
  }, { passive: true });
  send({ type: 'ready', title: document.title || '', y: 0 });
})();
</script>
