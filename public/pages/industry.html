<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industry | Webever Labs</title>
  <link rel="stylesheet" href="../designs.css">
</head>
<body class="embed glow-page">
  <div id="page-fit">
    <i class="orb a"></i><i class="orb b"></i><i class="orb c"></i>
    <section class="sub-hero wrap">
      <div class="sub-visual">
        <img id="shot" src="https://images.unsplash.com/photo-1563986768609-322e19255c1f?w=1200&amp;h=900&amp;fit=crop" alt="">
      </div>
      <div class="sub-copy">
        <p class="kicker" id="kicker">Industry</p>
        <h1 id="title">Your lane.</h1>
        <p class="lead" id="lead">Webever shapes the workspace to how this sector ships.</p>
        <div class="meta" id="meta"></div>
        <a class="btn-build" href="#ask">Start a build</a>
      </div>
    </section>
  </div>
  <script>
  (function () {
    var DATA = {
      fintech: { t: 'Fintech', d: 'Wallets, payouts and ledgers that look finished on day one.', p: ['Payments', 'Wallets', 'Store-ready'], img: 'https://images.unsplash.com/photo-1563986768609-322e19255c1f?w=1200&h=900&fit=crop' },
      healthcare: { t: 'Healthcare', d: 'Clinic tools and records with a calm, shippable interface.', p: ['Clinics', 'Records', 'Privacy'], img: 'https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=1200&h=900&fit=crop' },
      education: { t: 'Education', d: 'Class hubs and LMS flows that work on cheap phones.', p: ['Schools', 'LMS', 'Mobile'], img: 'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=1200&h=900&fit=crop' },
      retail: { t: 'Retail', d: 'Shops, inventory and checkout in one hybrid build.', p: ['Shops', 'Inventory', 'Checkout'], img: 'https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1200&h=900&fit=crop' },
      logistics: { t: 'Logistics', d: 'Fleet, delivery and tracking without a six-month rewrite.', p: ['Fleet', 'Delivery', 'Tracking'], img: 'https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=1200&h=900&fit=crop' },
      media: { t: 'Media', d: 'Publish and stream with a workspace that already looks on-air.', p: ['Publish', 'Stream', 'Brand'], img: 'https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=1200&h=900&fit=crop' },
      'real-estate': { t: 'Real estate', d: 'Listings and agents — live preview, then a store file.', p: ['Listings', 'Agents', 'Maps'], img: 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=1200&h=900&fit=crop' },
      agriculture: { t: 'Agriculture', d: 'Farms and supply tools that survive low signal.', p: ['Farms', 'Supply', 'Field'], img: 'https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1200&h=900&fit=crop' }
    };
    var slug = (window.WEBEVER && window.WEBEVER.slug) || 'fintech';
    var d = DATA[slug] || DATA.fintech;
    document.title = d.t + ' | Webever Labs';
    document.getElementById('kicker').textContent = 'Industry · ' + d.t;
    document.getElementById('title').textContent = d.t + '.';
    document.getElementById('lead').textContent = d.d;
    document.getElementById('meta').innerHTML = d.p.map(function (x) { return '<span class="pill">' + x + '</span>'; }).join('');
    var img = document.getElementById('shot');
    img.src = d.img; img.alt = d.t;
  })();
  </script>
</body>
</html>
