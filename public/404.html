<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>This page is not here · Webever Labs</title>
  <link rel="icon" href="./assets/logo.png">
  <style>
    @font-face {
      font-family: 'Bricolage Grotesque';
      font-weight: 800;
      font-display: swap;
      src: url('fonts/bricolage-800.woff2') format('woff2');
    }
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2.2rem 1.25rem;
      font-family: 'Bricolage Grotesque', Outfit, system-ui, sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(26,98,212,.08), transparent 42%),
        #fff;
      color: #111;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background:
          radial-gradient(circle at 50% 0%, rgba(30,144,255,.16), transparent 46%),
          #0b0d10;
        color: #f5f5f5;
      }
      .mark { background: #fff; color: #111; }
      .lead { color: #a7adb4; }
      .home { background: #fff; color: #111; }
    }
    main { width: min(100%, 520px); text-align: center; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      color: inherit;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .brand img { width: 30px; height: 30px; border-radius: 9px; }
    .mark {
      margin: 1.8rem auto .4rem;
      width: 72px;
      height: 72px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      font-size: 1.35rem;
      letter-spacing: -.04em;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 7vw, 3.4rem);
      letter-spacing: -.045em;
      line-height: .95;
    }
    .lead {
      margin: .9rem auto 1.6rem;
      max-width: 34ch;
      color: #6b7280;
      font-size: 1.02rem;
      line-height: 1.55;
    }
    .actions { display: flex; justify-content: center; gap: .7rem; flex-wrap: wrap; }
    .home, .ghost {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: .55rem 1.15rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
    }
    .home { background: #111; color: #fff; }
    .ghost { color: inherit; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="index.html">
      <img src="./assets/logo.png" alt="">
      Webever Labs
    </a>
    <h1>This page is not here</h1>
    <p class="lead">The link may be old, or the address was typed wrong. You can go back home and keep building.</p>
    <div class="actions">
      <a class="home" href="index.html">Back home</a>
      <a class="ghost" href="index.html#ask">Start a prompt</a>
    </div>
  </main>
</body>
</html>
